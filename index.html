<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Názvosloví">
<meta name="theme-color" content="#f5f3ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
<title>Názvosloví – trénink</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: tichý pracovní sešit; pohyb jen tam, kde něco vzniká
   IDEA: učebnicový nákres technickým perem na čtverečkovaném papíře, fixa, rámeček tužkou
   PICTURE: kostra molekuly, která se nakreslí čára po čáře, uprostřed obrazovky
   COLOUR and TYPE: papír, tuš, žlutá fixa; zelený a červený pruh jen pro výsledek; Literata pro chemii, Instrument Sans pro ovládání
   LAYOUT: jeden sloupec: lišta, nadpis kroku, nákres přes celou šířku, dole jediný panel s akcí */
:root{color-scheme:light dark;
--bg:light-dark(#f5f3ed,#151517);--paper:light-dark(#fbfaf6,#1d1d20);--grid:light-dark(rgba(52,84,160,.05),rgba(255,255,255,.035));--grid2:light-dark(rgba(52,84,160,.12),rgba(255,255,255,.075));
--ink:light-dark(#1b1b1d,#ebe7de);--soft:light-dark(#55524c,#b3afa6);--mute:light-dark(#8a867d,#7d7a73);
--hl:light-dark(#f3d34a,#d6b62c);--hlink:#1b1b1d;--frame:light-dark(#8f8a80,#77736b);
--ok:light-dark(#2b6b3c,#86d39f);--bad:light-dark(#c2302a,#ff7d70);--okband:#2b6b3c;--badband:#b8302a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
.app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:max(6px,env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:center;gap:16px}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em;margin-right:auto}
.txt{border:0;background:none;padding:8px 0;min-height:40px;font-size:14px;color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
.lvl{position:relative}
.lvl select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:8px 16px 8px 0;min-height:40px;font-size:14px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
.lvl::after{content:"";position:absolute;right:2px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.bar{height:2px;background:color-mix(in srgb,var(--ink) 10%,transparent);margin-top:2px;position:relative}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .5s cubic-bezier(.3,.7,.2,1)}
.head{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px}
.head i{margin-left:auto;font-family:Literata,Georgia,serif;font-size:14px;color:var(--mute)}
h1{font-weight:600;font-size:clamp(26px,7.4vw,34px);line-height:1.08;margin:0;letter-spacing:-.02em}
.sub{margin:0;color:var(--soft);font-size:14px;line-height:1.4}
.txt.inl{min-height:0;padding:0;font-size:14px;color:var(--soft)}
.ruleText{font-family:Literata,Georgia,serif;font-style:italic;font-size:14px;margin:6px 0 0;max-width:52ch;display:none}
.ruleText.open{display:block}
.stage{position:relative;margin:12px -16px 0;padding:4px 0;overflow-x:auto;overflow-y:hidden;flex:1 0 auto;display:flex;align-items:center;min-height:180px;
background-color:var(--paper);background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:center}
.board{position:relative;margin:0 auto;flex:none}
.board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.bond{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
.bond.onp{stroke:var(--hlink)}
.atom{position:absolute;display:block;border:0;padding:2px 1px 2px 2px;background:none;font-family:Literata,Georgia,serif;line-height:1;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transform:translate(-50%,-50%);color:var(--ink)}
.atom .c{display:inline-block}
.atom.het{cursor:default}
.atom.on{color:var(--hlink)}
.atom:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.slot{position:absolute;left:100%;top:0;padding:2px 2px 2px 0;line-height:1;white-space:nowrap}
.slot sub{font-size:.62em;vertical-align:-.25em;line-height:0}
.slot.empty{color:color-mix(in srgb,var(--ink) 32%,transparent)}
.slot.sel.empty{color:var(--ink)}
.slot.sel{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.slot.none{padding:0}
.slot.none.sel::before{content:"";display:inline-block;width:.45em;height:.1em;margin-left:2px;background:var(--ink)}
.slot.bad{color:var(--bad)}
.slot.bad.none::before{content:"";display:inline-block;width:.45em;height:.1em;margin-left:2px;background:var(--bad)}
.slot.bad{text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.num{position:absolute;font-family:Literata,Georgia,serif;font-style:italic;font-weight:600;transform:translate(-50%,-50%);pointer-events:none}
.num.bad{color:var(--bad)}
.arrow{position:absolute;border:0;background:none;padding:8px;line-height:0;color:var(--ink);cursor:pointer;transform:translate(-50%,-50%) rotate(var(--a))}
.arrow svg{display:block;animation:nudge 1.1s ease-in-out infinite}
.arrow path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes nudge{0%,100%{translate:-3px 0}50%{translate:3px 0}}
.hpop{position:absolute;z-index:8;display:none;gap:6px;padding:6px;background:var(--paper);border:1px solid var(--ink);border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.08);transition:left .2s ease,top .2s ease}
.hpop.show{display:flex}
.hpop::before{content:"";position:absolute;left:var(--ax,50%);top:-6px;width:10px;height:10px;background:var(--paper);border-left:1px solid var(--ink);border-top:1px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.hpop.up::before{top:auto;bottom:-6px;transform:translateX(-50%) rotate(225deg)}
.hpop button{min-width:56px;height:46px;padding:0 8px;border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);border-radius:10px;background:var(--bg);font-family:Literata,Georgia,serif;font-size:20px;cursor:pointer;transition:background .12s,color .12s}
.hpop button:active{background:var(--ink);color:var(--bg)}
.hpop sub{font-size:.62em}.hpop .z{font-family:'Instrument Sans',sans-serif;font-size:13px}
.leader{position:absolute;z-index:7;width:0;border-left:1px dashed color-mix(in srgb,var(--ink) 45%,transparent);display:none;transition:left .2s ease,top .2s ease,height .2s ease;pointer-events:none}
.leader.show{display:block}
/* název */
.nameArea{margin-top:12px;display:none}
.nameArea.show{display:block}
.nrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 2px;margin-bottom:10px}
.nrow>small{flex-basis:100%;font-size:12px;color:var(--mute);margin-bottom:2px}
.grp{display:inline-flex;align-items:flex-end;gap:2px;margin-right:6px}
.dash{font-family:Literata,Georgia,serif;font-size:19px;padding-bottom:6px;color:var(--soft)}
.f{min-width:46px;min-height:40px;padding:4px 6px 5px;border:0;border-bottom:1.5px solid var(--ink);background:none;font-family:Literata,Georgia,serif;font-size:19px;line-height:1.2;cursor:pointer;text-align:center}
.f.empty{color:var(--mute);font-family:'Instrument Sans',sans-serif;font-size:12px;font-style:normal;border-bottom-style:dashed}
.f.open{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.f.bad{color:var(--bad);border-bottom-color:var(--bad)}
.f:disabled{opacity:.3;cursor:default}
.plus{border:1px dashed color-mix(in srgb,var(--ink) 40%,transparent);background:none;border-radius:8px;min-height:36px;padding:0 10px;font-size:13px;color:var(--soft);cursor:pointer;margin-bottom:2px}
.preview{font-family:Literata,Georgia,serif;font-weight:600;font-size:clamp(19px,5.4vw,24px);min-height:32px;overflow-wrap:anywhere;padding-top:4px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
.preview.empty{font-weight:400;font-style:italic;color:var(--mute);font-size:15px}
.pick{position:fixed;left:0;right:0;bottom:0;z-index:35;display:none}
.pick.show{display:block}
.pick .in{max-height:86vh;overflow-y:auto;max-width:620px;margin:0 auto;background:var(--paper);border:1px solid var(--ink);border-bottom:0;border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.pick h3{margin:0 0 10px;font-size:14px;font-weight:600}
.opts{display:grid;gap:6px}
.opts button{min-height:46px;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:9px;background:none;font-family:Literata,Georgia,serif;font-size:18px;cursor:pointer;transition:background .12s,color .12s}
.opts button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts button.wide{grid-column:1/-1;font-family:'Instrument Sans',sans-serif;font-size:14px}
.pick .row{display:flex;align-items:center;gap:16px;margin-top:10px}
/* panel dole */
footer{position:sticky;bottom:0;margin:auto -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.msg{font-size:14px;line-height:1.35;margin:0 0 8px;color:var(--soft);display:none}
.msg.show{display:block}
.acts{display:flex;align-items:center;gap:16px;min-height:44px}
.acts .txt{flex:0 0 auto}
.btn{margin-left:auto;flex:0 1 200px;min-height:46px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;cursor:pointer;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.25;cursor:default}
.btn.ok{background:var(--ok);color:#fff}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none}
.fb.show{display:block}
.fb.ok{background:var(--okband)}.fb.bad{background:var(--badband)}
.fb .in{max-width:620px;margin:0 auto;padding:18px 18px calc(16px + env(safe-area-inset-bottom));color:#fff}
.fbT{font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.fbM{margin:6px 0 14px;font-size:16px;line-height:1.4}
.fbM b{font-family:Literata,Georgia,serif;font-size:20px}
.fb .acts .txt{color:#fff}
.fb .btn{background:#fff;color:#1b1b1d}
.set{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.set:first-child{border-top:0}
.set span{flex:1;font-size:15px;line-height:1.3}
.set small{display:block;font-size:12px;color:var(--mute)}
.sw{flex:none;width:46px;height:28px;border-radius:14px;border:1.5px solid var(--ink);background:none;position:relative;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--ink);transition:transform .18s ease,background .15s}
.sw[aria-checked=true]{background:var(--ink)}
.sw[aria-checked=true]::after{transform:translateX(18px);background:var(--bg)}
.sw:disabled{opacity:.35}
.sethead{font-size:12px;color:var(--mute);margin:12px 0 0}
.opts button.tog{grid-column:1/-1;font-family:'Instrument Sans',sans-serif;font-size:14px}
.hide{display:none!important}
@keyframes shake{0%,100%{translate:0}25%{translate:-5px}50%{translate:5px}75%{translate:-3px}}
.shake{animation:shake .35s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="brand">Názvosloví</span>
    <label class="lvl"><select id="lvl" aria-label="Obtížnost"><option value="1">lehké</option><option value="2">střední</option><option value="3">těžké</option><option value="4">extrém</option></select></label>
    <button class="txt" id="setBtn">nastavení</button>
    <button class="txt" id="newBtn">nový</button>
  </div>
  <div class="bar"><b id="bar" style="width:0"></b></div>
  <div class="head"><h1 id="title">Doplň vodíky</h1><i id="stepNo">1/4</i></div>
  <p class="sub"><span id="sub"></span> <button class="txt inl" id="ruleBtn" aria-expanded="false">pravidlo</button></p>
  <p class="ruleText" id="ruleText"></p>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <svg aria-hidden="true"><g id="hlG"></g><g id="bondG"></g></svg>
      <div id="atomL"></div><div id="numL"></div>
    </div>
    <div class="leader" id="leader"></div>
    <div class="hpop" id="hpop" aria-label="Kolik vodíků"><button data-v="3">CH<sub>3</sub></button><button data-v="2">CH<sub>2</sub></button><button data-v="1">CH</button><button data-v="0">C</button></div>
  </div>
  <div class="nameArea" id="nameArea"></div>
  <footer>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="acts"><button class="txt" id="clr">smazat</button><button class="txt" id="help">nevím</button><button class="btn" id="pri">Zkontrolovat</button></div>
  </footer>
</div>
<div class="pick" id="pick" role="dialog" aria-modal="true" aria-labelledby="pickT"><div class="in"><h3 id="pickT"></h3><div class="opts" id="pickO"></div><div class="row"><button class="txt hide" id="pickDel">odebrat</button><button class="btn" id="pickOk">Hotovo</button></div></div></div>
<div class="pick" id="setSheet" role="dialog" aria-modal="true" aria-labelledby="setT"><div class="in"><h3 id="setT">Nastavení</h3><div id="setList"></div><div class="row"><button class="txt" id="setReset">výchozí</button><button class="btn" id="setOk">Hotovo</button></div></div></div>
<div class="fb" id="fb" role="status" aria-live="polite"><div class="in"><div class="fbT" id="fbT"></div><p class="fbM" id="fbM"></p><div class="acts"><button class="txt" id="fbHelp">nevím</button><button class="btn" id="fbBtn"></button></div></div></div>
<script>
{
const $=s=>document.querySelector(s);
const STEMS=['','meth','eth','prop','but','pent','hex','hept','okt','non','dek','undek','dodek'];
const ALK=['','methyl','ethyl','propyl','butyl'];
const MULT=['','','di','tri','tetra'];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HTXT=['','H','H<sub>2</sub>','H<sub>3</sub>'];
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const anim=(el,k,o)=>RM.matches||!el||!el.animate?null:el.animate(k,o);

/* ---------- chemie ---------- */
const HAL={F:'fluor',Cl:'chlor',Br:'brom',I:'jod'};
const HVAL={F:1,Cl:1,Br:1,I:1,OH:1,O:2};
function adjOf(m){const adj=m.atoms.map(()=>[]);for(const b of m.bonds){adj[b.a].push({to:b.b,o:b.o});adj[b.b].push({to:b.a,o:b.o})}adj.T=m.atoms.map(a=>a.t||'C');return adj}
const isC=(adj,id)=>!adj.T||adj.T[id]==='C';
const val=(adj,id)=>adj[id].reduce((s,e)=>s+e.o,0);
const bo=(adj,a,b)=>{const e=adj[a].find(e=>e.to===b);return e?e.o:0};
const cdeg=(adj,id)=>adj[id].filter(e=>isC(adj,e.to)).length;
function pathBetween(adj,u,v){const prev=new Map([[u,-1]]);const q=[u];while(q.length){const x=q.shift();if(x===v)break;for(const e of adj[x])if(isC(adj,e.to)&&!prev.has(e.to)){prev.set(e.to,x);q.push(e.to)}}const P=[];let c=v;while(c!==-1){P.push(c);c=prev.get(c)}return P.reverse()}
function branchesOf(adj,P,chain){
  const inP=new Set(P),subs=[],g={};let valid=true;
  const hetOn=id=>adj[id].some(f=>!isC(adj,f.to));
  P.forEach((id,i)=>{for(const e of adj[id]){if(inP.has(e.to))continue;const t=adj.T?adj.T[e.to]:'C';
    if(t!=='C'){if(HAL[t])subs.push({loc:i+1,name:HAL[t]});else{(g[i]=g[i]||{})[t]=true}continue}
    if(e.o!==1)valid=false;
    const first=adj[e.to].filter(f=>f.to!==id);
    if(first.length===2&&first.every(f=>f.o===1&&isC(adj,f.to)&&adj[f.to].length===1)){subs.push({loc:i+1,name:'isopropyl'});continue}
    let len=1,prev=id,cur=e.to;
    for(;;){if(hetOn(cur))valid=false;const nx=adj[cur].filter(f=>f.to!==prev);if(!nx.length)break;if(nx.length>1){valid=false;break}if(nx[0].o!==1)valid=false;prev=cur;cur=nx[0].to;len++}
    if(len>4)valid=false;subs.push({loc:i+1,name:ALK[Math.min(len,4)]})}});
  const pl=[];let cls=null;const rank={acid:4,al:3,on:2,ol:1};
  for(const k in g){const i=+k,x=g[k],end=chain&&(i===0||i===P.length-1);let c;
    if(x.O&&x.OH){c='acid';if(!end)valid=false}
    else if(x.O)c=end&&cdeg(adj,P[i])<=1?'al':'on';
    else c='ol';
    if(!chain&&c!=='ol'&&c!=='on')valid=false;
    if(cls&&cls!==c){valid=false;if(rank[c]>rank[cls])cls=c}else cls=c;
    pl.push(i+1)}
  pl.sort((a,b)=>a-b);
  if(!chain&&cls)valid=false;
  const sl=subs.map(s=>s.loc).sort((a,b)=>a-b);
  const alpha=[...subs].sort((a,b)=>(a.name<b.name?-1:a.name>b.name?1:0)||a.loc-b.loc).map(s=>s.loc);
  return {subs,sl,alpha,valid,pl,cls};
}
function evalPath(adj,P){
  const mb=[],dl=[],tl=[];
  for(let i=0;i<P.length-1;i++){const o=bo(adj,P[i],P[i+1]);if(o>1){mb.push(i+1);(o===2?dl:tl).push(i+1)}}
  return {P,len:P.length,mb,dl,tl,...branchesOf(adj,P,true)};
}
function isArom(adj,P){if(P.length!==6)return false;const o=P.map((id,i)=>bo(adj,id,P[(i+1)%6]));return o.join()==='2,1,2,1,2,1'||o.join()==='1,2,1,2,1,2'}
function evalRing(adj,P){
  const k=P.length,mb=[],dl=[],tl=[],arom=isArom(adj,P);
  if(!arom)for(let i=0;i<k;i++){const o=bo(adj,P[i],P[(i+1)%k]);if(o>1){mb.push(i+1);(o===2?dl:tl).push(i+1)}}
  return {P,len:k,ring:true,arom,mb,dl,tl,...branchesOf(adj,P,false)};
}
function findRing(adj){
  const n=adj.length,deg=adj.map(a=>a.length),alive=new Set([...Array(n).keys()]);
  const q=[...alive].filter(i=>deg[i]<=1);
  while(q.length){const x=q.pop();if(!alive.has(x))continue;alive.delete(x);for(const e of adj[x])if(alive.has(e.to)){deg[e.to]--;if(deg[e.to]===1)q.push(e.to)}}
  if(alive.size<3)return null;
  const start=[...alive][0],ring=[start];let prev=-1,cur=start;
  for(let g=0;g<64;g++){const nx=adj[cur].filter(e=>alive.has(e.to)&&e.to!==prev);if(!nx.length)return null;const to=nx[0].to;if(to===start)break;ring.push(to);prev=cur;cur=to}
  return ring.length===alive.size?ring:null;
}

/* ---------- nákres ---------- */
const stage=$('#stage'),board=$('#board'),bondG=$('#bondG'),hlG=$('#hlG'),atomL=$('#atomL'),numL=$('#numL');
const popOn=()=>S.step===0&&!S.ok&&S.sel!=null;
function layout(){
  const xs=M.atoms.map(a=>a.x),ys=M.atoms.map(a=>a.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const cols=maxX-minX+1,rows=maxY-minY+1;
  const extra=S.step===0&&!S.ok?78:0;
  const wFit=(stage.clientWidth-12)/(cols+.8);
  const top=stage.getBoundingClientRect().top+scrollY,footH=$('footer').offsetHeight;
  const reserve=S.step===3?Math.max(190,$('#nameArea').offsetHeight):0;
  const ky=S.step===3?.72:.82,hFit=(innerHeight-top-footH-reserve-extra-30)/(rows*ky+1);
  SC=Math.max(40,Math.min(104,wFit,hFit));
  const SY=SC*ky;
  FS=Math.max(16,Math.min(34,SC*.37));
  const ox=SC*.8,oy=FS*1.9;
  POS={};M.atoms.forEach(a=>POS[a.id]={x:(a.x-minX)*SC+ox,y:(a.y-minY)*SY+oy});
  MOLB=(rows-1)*SY+oy+FS*.6;

}
function boxOf(id){

  return {l:r.left-br.left,r:Math.max(r.right,s.width?s.right:0)-br.left,t:r.top-br.top,b:r.bottom-br.top};
}
function trim(id,ux,uy,bx){const p=POS[id],hw=ux>0?bx.r-p.x:p.x-bx.l,hh=uy<0?p.y-bx.t:bx.b-p.y;
  return Math.min(Math.abs(ux)>1e-6?hw/Math.abs(ux):1e9,Math.abs(uy)>1e-6?hh/Math.abs(uy):1e9)+1}
function updateBonds(){
  if(!LINES.length)return;
  const BX={};M.atoms.forEach(a=>BX[a.id]=boxOf(a.id));
  LINES.forEach(L=>{const {a,b}=L.b,p=POS[a],q=POS[b],dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    const s=trim(a,ux,uy,BX[a]),e=trim(b,-ux,-uy,BX[b]);
    const ax=p.x+ux*s,ay=p.y+uy*s,bx=q.x-ux*e,by=q.y-uy*e;L.len=Math.max(1,Math.hypot(bx-ax,by-ay));
    L.ls.forEach((l,i)=>{const o=L.offs[i];l.setAttribute('x1',ax+nx*o);l.setAttribute('y1',ay+ny*o);l.setAttribute('x2',bx+nx*o);l.setAttribute('y2',by+ny*o)})});
}
function build(animate){
  layout();
  bondG.textContent='';atomL.textContent='';ATOM={};LINES=[];
  M.atoms.forEach(a=>{const e=document.createElement('button');e.className='atom'+(a.t?' het':'');e.dataset.id=a.id;e.setAttribute('aria-label',a.t||'uhlík');
    e.style.left=POS[a.id].x+'px';e.style.top=POS[a.id].y+'px';e.style.fontSize=FS+'px';
    e.innerHTML=`<span class="c">${a.t||'C'}</span><span class="slot"></span>`;atomL.appendChild(e);ATOM[a.id]=e});
  M.atoms.forEach(a=>paintSlot(a.id));

    LINES.push({b,offs,len:1,ls:offs.map(()=>{const l=document.createElementNS(NS,'line');l.setAttribute('class','bond');bondG.appendChild(l);return l})})});

function drawIn(){
  if(RM.matches||!document.body.animate)return;
  const start=SOL.best.P[0],dep={[start]:0},q=[start],edges=[];
  while(q.length){const x=q.shift();for(const e of ADJ[x])if(dep[e.to]==null){dep[e.to]=dep[x]+1;q.push(e.to);edges.push([x,e.to])}}
  const maxD=Math.max(1,...Object.values(dep)),step=Math.min(300,1300/maxD),dur=Math.max(180,step*1.05);
  edges.forEach(([x,y])=>{const li=LINES.find(L=>(L.b.a===x&&L.b.b===y)||(L.b.b===x&&L.b.a===y)),d=dep[x]*step+80;
    const fwd=li.b.a===x;
    li.ls.forEach(l=>{l.style.strokeDasharray=li.len;const an=l.animate([{strokeDashoffset:fwd?li.len:-li.len},{strokeDashoffset:0}],{duration:dur,delay:d,easing:'cubic-bezier(.55,0,.3,1)',fill:'backwards'});an.onfinish=()=>l.style.strokeDasharray=''})});
  M.atoms.forEach(a=>{const e=ATOM[a.id],d=dep[a.id]?dep[a.id]*step+80+dur*.55:0;

    e.querySelector('.slot').animate([{opacity:0},{opacity:1}],{duration:240,delay:d+200,fill:'backwards'})});

const isCarb=id=>!M.atoms[id].t;
function paintSlot(id,fresh){

  if(S.step===0&&!S.ok){
    s.className='slot'+(h==null?' empty':'')+(h===0?' none':'')+(S.sel===id?' sel':'')+(S.bad.has(id)?' bad':'');

function chainRuns(P){
  const runs=[];let cur=[P[0]],dir=null;
  for(let i=1;i<P.length;i++){const a=POS[P[i-1]],b=POS[P[i]],d=Math.sign(Math.round(b.x-a.x))+','+Math.sign(Math.round(b.y-a.y));

}
function chainShapes(P,pad,col){

    const p0=POS[run[0]],p1=POS[run[run.length-1]];
    if(Math.abs(p1.x-p0.x)>1&&Math.abs(p1.y-p0.y)>1){const w=FS*1.25+pad*2;
      return `<polyline points="${run.map(id=>POS[id].x+','+POS[id].y).join(' ')}" style="fill:none;stroke:${col};stroke-width:${w};stroke-linecap:round;stroke-linejoin:round"/>`+run.map(id=>{const x=BX[id];return `<rect x="${x.l-pad}" y="${x.t-pad}" width="${x.r-x.l+pad*2}" height="${x.b-x.t+pad*2}" rx="${Math.min(FS*.5,(x.b-x.t)/2+pad)}" style="fill:${col}"/>`}).join('')}
    let l=1e9,r=-1e9,t=1e9,b=-1e9;run.forEach(id=>{const x=BX[id];l=Math.min(l,x.l);r=Math.max(r,x.r);t=Math.min(t,x.t);b=Math.max(b,x.b)});
    l-=pad;r+=pad;t-=pad;b+=pad;const rx=Math.min(FS*.5,(b-t)/2,(r-l)/2);

}
function ringShapes(P,pad,col){

function ringCenter(){const R=S.ring;return {x:R.reduce((s,id)=>s+POS[id].x,0)/R.length,y:R.reduce((s,id)=>s+POS[id].y,0)/R.length}}
function paintHL(){
  const P=S.path,mark=S.step===1&&!S.ok;

  const pairs=new Set();if(mark)for(let i=0;i<P.length-1;i++){pairs.add(P[i]+'-'+P[i+1]);pairs.add(P[i+1]+'-'+P[i])}

function segDist(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy||1;let t=((px-a.x)*dx+(py-a.y)*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a.x-t*dx,py-a.y-t*dy)}

/* ---------- hlavička a panel ---------- */

/* ---------- průběh ---------- */

  ORDER=M.atoms.filter(a=>!a.t).sort((a,b)=>a.y-b.y||a.x-b.x).map(a=>a.id);

/* krok 0 */
function chooseAtom(id){if(!isCarb(id)||S.sel===id)return;const old=S.sel;S.sel=id;if(old!=null)paintSlot(old);paintSlot(id);updateBonds();paintFoot()}
function setH(v){

  const i=ORDER.indexOf(id);let nx=null;
  for(let k=1;k<=ORDER.length;k++){const c=ORDER[(i+k)%ORDER.length];if(S.h[c]==null){nx=c;break}}
  S.sel=nx;paintSlot(id,true);if(nx!=null)paintSlot(nx);updateBonds();paintFoot();
}
function checkH(){
  const wrong=M.atoms.filter(a=>!a.t&&S.h[a.id]!==4-val(ADJ,a.id)).map(a=>a.id);
  if(!wrong.length){S.sel=null;S.ok=true;M.atoms.forEach(a=>paintSlot(a.id));updateBonds();solved('Sedí.','Každý uhlík má teď čtyři vazby.');return}
  S.bad=new Set(wrong);S.sel=wrong[0];M.atoms.forEach(a=>paintSlot(a.id));updateBonds();
  wrong.forEach(id=>{const s=ATOM[id].querySelector('.slot');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')});
  say('bad',wrong.length===1?'Jeden uhlík nesedí.':`Nesedí ${wrong.length} ${wrong.length<5?'uhlíky':'uhlíků'}.`,'Spočítej u nich čáry: 4 − vazby k uhlíkům = vodíky.');paintFoot();
}

/* krok 1 */
const isAdj=(a,b)=>ADJ[a].some(e=>e.to===b);
let chainDrag=false,raf=0,lastPt=null;
function chainTap(id){
  if(!isCarb(id)){say('hint','','Do řetězce patří jen uhlíky.');return}
  const p=S.path,last=p[p.length-1];
  if(p.length&&id===last)return;
  if(p.length>1&&id===p[p.length-2])p.pop();
  else if(p.length>1&&p[0]===id)p.reverse();
  else if(p.length&&!p.includes(id)&&isAdj(last,id))p.push(id);
  else S.path=[id];
  hush();paintHL();paintFoot();
}
function chainMove(){
  raf=0;if(!lastPt)return;
  const e=document.elementFromPoint(lastPt.x,lastPt.y),a=e&&e.closest('.atom');if(!a)return;
  const id=+a.dataset.id,p=S.path,last=p[p.length-1];if(id===last||!isCarb(id))return;
  if(p.length>1&&id===p[p.length-2]){p.pop();paintHL()}
  else if(!p.includes(id)&&isAdj(last,id)){p.push(id);paintHL()}
}
function checkChain(){
  const P=S.path,leaf=id=>ADJ[id].length===1,mine=bestDir(ADJ,P);

function target(){
  const T={subs:[],stem:'',bonds:[],grp:{locs:[],mult:'',suf:''}};let cur=null,after=false;

    if(tk.k==='smult'){T.grp.mult=tk.t;continue}
    if(tk.k==='suf'){T.grp.suf=tk.t;continue}
    if(tk.k==='stem'){T.stem=tk.t;after=true;cur=null;continue}
    if(!after){
      if(tk.k==='loc'){cur={locs:locs(tk.t),mult:'',alk:''};T.subs.push(cur)}
      else if(tk.k==='mult'){if(!cur){cur={locs:[],mult:'',alk:''};T.subs.push(cur)}cur.mult=tk.t}
      else if(tk.k==='alk'){if(!cur||cur.alk){cur={locs:[],mult:'',alk:''};T.subs.push(cur)}cur.alk=tk.t;cur=null}
    }else{

      else if(tk.k==='mult'){if(!cur){cur={locs:[],mult:'',end:''};T.bonds.push(cur)}cur.mult=tk.t}
      else if(tk.k==='end'){if(!cur||cur.end){cur={locs:[],mult:'',end:''};T.bonds.push(cur)}cur.end=tk.t;cur=null}

  if(S.step===2&&S.ring){numTok++;S.lock=false;S.dir=null;S.r1=SOL.best.P[0];ringNumTap(SOL.best.P[1],true);return}
  if(S.step===2){numTok++;S.lock=false;S.dir=null;const d=bestDir(ADJ,S.path).P;numberFrom(d[0],true);return}
  if(S.step===3){closePick();const T=target();S.nm={subs:T.subs.map(g=>({...g,locs:[...g.locs]})),stem:T.stem,cyc:/^cyklo/.test(T.stem),bonds:T.bonds.length?T.bonds.map(b=>({...b,locs:[...b.locs]})):[{locs:[],mult:'',end:''}],grp:{...T.grp,locs:[...T.grp.locs]}};finish()}
}

/* ---------- události ---------- */
board.addEventListener('pointerdown',e=>{
  const a=e.target.closest('.atom');if(!a)return;const id=+a.dataset.id;
  if(S.step===1&&!S.ok&&!S.ring){e.preventDefault();chainDrag=true;chainTap(id)}
});
window.addEventListener('pointermove',e=>{if(chainDrag){lastPt={x:e.clientX,y:e.clientY};if(!raf)raf=requestAnimationFrame(chainMove)}},{passive:true});
const endDrag=()=>{if(chainDrag){chainDrag=false;lastPt=null;paintFoot()}};
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
board.addEventListener('click',e=>{
  const ar=e.target.closest('.arrow');if(ar)return numberFrom(+ar.dataset.end);
  const a=e.target.closest('.atom');if(!a)return;const id=+a.dataset.id;
  if(S.step===0&&!S.ok)chooseAtom(id);
  else if(S.step===1&&S.ring)ringTap(id);
  else if(S.step===1&&!S.ok&&e.detail===0)chainTap(id);
  else if(S.step===2)S.ring?ringNumTap(id):numberFrom(id);
});
$('#hpop').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)setH(+b.dataset.v)});
$('#pri').addEventListener('click',()=>{if(S.ok)return next();[checkH,checkChain,null,checkName][S.step]?.()});
$('#clr').addEventListener('click',()=>{hush();if(S.step===1){S.path=[];paintHL()}if(S.step===3){S.nm={subs:[{locs:[],mult:'',alk:''}],stem:'',bonds:[{locs:[],mult:'',end:''}],grp:{locs:[],mult:'',suf:''}};S.badF.clear();renderName()}paintFoot()});
$('#help').addEventListener('click',help);
$('#setBtn').addEventListener('click',openSets);
$('#setOk').addEventListener('click',closeSets);
$('#setReset').addEventListener('click',()=>{OPT=Object.assign({},OPTDEF);renderSets()});
$('#setList').addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b||b.disabled)return;const k=b.dataset.k;OPT[k]=!OPT[k];if(!OPT.cyclo&&!OPT.arom)OPT.onlyCyclo=false;renderSets()});
$('#fbHelp').addEventListener('click',help);
$('#fbBtn').addEventListener('click',()=>{if(S.ok){hideFb();return next()}const a=fbAfter;fbAfter=null;hideFb();a&&a()});
$('#ruleBtn').addEventListener('click',()=>{const o=$('#ruleText').classList.toggle('open');$('#ruleBtn').setAttribute('aria-expanded',o);build(false);paintFoot()});
$('#lvl').addEventListener('change',e=>{S.level=+e.target.value;store.set('nz-level',S.level);newProblem()});
$('#newBtn').addEventListener('click',()=>{if(S.step>0||Object.keys(S.h).length){S.streak=0;store.set('nz-streak',0)}newProblem()});
let rzT=0;const rebuild=()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(M){build(false);paintFoot()}},100)};
window.addEventListener('resize',rebuild);
let lastW=0;const ro=new ResizeObserver(()=>{if(M&&stage.clientWidth!==lastW){lastW=stage.clientWidth;rebuild()}});ro.observe(stage);
stage.addEventListener('scroll',placePop,{passive:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(M){updateBonds();paintHL();paintNums(false);placePop()}});
newProblem();lastW=stage.clientWidth;
}
</script>
</body>
